plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

base {
	archivesName = 'frameboost'
}

loom {
	runs {
		// Starts the client only until mixins are applied to all target classes, then exits.
		// Used by CI to prove the mixins apply on this Minecraft version, with and without VulkanMod.
		mixinAudit {
			client()
			name = 'Mixin Audit'
			vmArg '-Dframeboost.audit=true'
			vmArg '-Dmixin.debug.verbose=true'
			runDir 'run-audit'
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Optional: pass -Pvulkanmod_jar=/path/to/VulkanMod.jar to test together with VulkanMod.
	if (project.hasProperty('vulkanmod_jar')) {
		localRuntime files(project.property('vulkanmod_jar'))
	}
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}
